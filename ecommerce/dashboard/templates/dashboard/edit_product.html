{% extends "dashboard/base.html" %}

{% block content %}

<!-- ========================================================= -->
<!-- CONTAINER -->
<!-- ========================================================= -->

<div class="w-full max-w-4xl mx-auto">


    <!-- ===================================================== -->
    <!-- CARD -->
    <!-- ===================================================== -->

    <div class="bg-white rounded-[28px] sm:rounded-3xl p-5 sm:p-8 lg:p-10 border border-gray-100 shadow-sm">


        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <div class="mb-7 sm:mb-10">

            <div class="flex items-start gap-4">

                <!-- ICON -->

                <div class="hidden sm:flex flex-shrink-0 w-14 h-14 rounded-2xl bg-yellow-50 items-center justify-center">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-7 w-7 text-yellow-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M11 5h2m-1-1v2m-7 9l-4 4m0 0l4-4m-4 4h18" />

                    </svg>

                </div>


                <div>

                    <h1 class="text-2xl sm:text-4xl font-black text-gray-900">

                        Modifier Produit

                    </h1>

                    <p class="text-gray-400 mt-2 sm:mt-3 text-sm sm:text-base">

                        Modifiez les informations du produit.

                    </p>

                </div>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- FORM -->
        <!-- ================================================= -->

        <form method="POST"
              enctype="multipart/form-data"
              class="space-y-6">

            {% csrf_token %}


            <!-- ================================================= -->
            <!-- DJANGO FORM -->
            <!-- ================================================= -->

            <div id="product-edit-form"
                 class="space-y-5">

                {{ form.as_p }}

            </div>



            <!-- ================================================= -->
            <!-- BUTTON -->
            <!-- ================================================= -->

            <div class="pt-3">

                <button type="submit"
                        class="w-full sm:w-auto bg-yellow-600 hover:bg-yellow-700 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-yellow-600/20 transition-all duration-300 hover:scale-[1.02]">

                    <i class="fas fa-save mr-2"></i>

                    Sauvegarder

                </button>

            </div>

        </form>

    </div>

</div>



<!-- ========================================================= -->
<!-- RESPONSIVE FORM STYLE -->
<!-- ========================================================= -->

<style>

    /*
    ============================================================
    FORMULAIRE DJANGO
    ============================================================
    */

    #product-edit-form p {

        margin: 0;

        display: flex;

        flex-direction: column;

        gap: 8px;

    }


    /*
    ============================================================
    LABELS
    ============================================================
    */

    #product-edit-form label {

        font-size: 14px;

        font-weight: 700;

        color: #374151;

    }


    /*
    ============================================================
    INPUTS / SELECT / TEXTAREA
    ============================================================
    */

    #product-edit-form input[type="text"],
    #product-edit-form input[type="number"],
    #product-edit-form input[type="email"],
    #product-edit-form input[type="url"],
    #product-edit-form input[type="file"],
    #product-edit-form input[type="date"],
    #product-edit-form input[type="datetime-local"],
    #product-edit-form select,
    #product-edit-form textarea {

        width: 100%;

        min-height: 48px;

        border: 1px solid #e5e7eb;

        border-radius: 14px;

        background: #ffffff;

        padding: 12px 14px;

        color: #111827;

        font-size: 15px;

        outline: none;

        transition: all 0.2s ease;

    }


    /*
    ============================================================
    TEXTAREA
    ============================================================
    */

    #product-edit-form textarea {

        min-height: 140px;

        resize: vertical;

    }


    /*
    ============================================================
    FOCUS
    ============================================================
    */

    #product-edit-form input:focus,
    #product-edit-form select:focus,
    #product-edit-form textarea:focus {

        border-color: #eab308;

        box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.10);

    }


    /*
    ============================================================
    INPUT FILE
    ============================================================
    */

    #product-edit-form input[type="file"] {

        padding: 10px;

        cursor: pointer;

        background: #f8faff;

    }


    /*
    ============================================================
    CHECKBOX
    ============================================================
    */

    #product-edit-form input[type="checkbox"] {

        width: 18px;

        height: 18px;

        accent-color: #ca8a04;

    }


    /*
    ============================================================
    HELP TEXT
    ============================================================
    */

    #product-edit-form .helptext {

        font-size: 12px;

        color: #9ca3af;

    }


    /*
    ============================================================
    ERREURS
    ============================================================
    */

    #product-edit-form .errorlist {

        list-style: none;

        padding: 0;

        margin: 0 0 4px 0;

        color: #dc2626;

        font-size: 13px;

        font-weight: 600;

    }


    /*
    ============================================================
    MOBILE
    ============================================================
    */

    @media (max-width: 640px) {

        #product-edit-form input[type="text"],
        #product-edit-form input[type="number"],
        #product-edit-form input[type="email"],
        #product-edit-form input[type="url"],
        #product-edit-form input[type="file"],
        #product-edit-form input[type="date"],
        #product-edit-form input[type="datetime-local"],
        #product-edit-form select,
        #product-edit-form textarea {

            font-size: 16px;

        }


        #product-edit-form textarea {

            min-height: 120px;

        }

    }


    /*
    ============================================================
    PETIT TELEPHONE
    ============================================================
    */

    @media (max-width: 380px) {

        #product-edit-form input[type="file"] {

            font-size: 13px;

        }

    }

</style>

{% endblock %}
